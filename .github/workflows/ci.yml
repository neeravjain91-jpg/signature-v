name: SYNAPSE CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: synapse_test
          POSTGRES_PASSWORD: synapse_test_password
          POSTGRES_DB: synapse_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate SQL Schema & Migrations
      env:
        DATABASE_URL: postgresql://synapse_test:synapse_test_password@localhost:5432/synapse_test_db
      run: |
        alembic upgrade head
        python database/seed_demo_data.py

    - name: Run Pytest Test Suite
      env:
        DATABASE_URL: sqlite:///database/banking_system_demo.db
      run: |
        pytest -v tests/
